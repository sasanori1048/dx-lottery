<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>抽選ページ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>抽選ページ</h1>
  <p>抽選ボタンを押して景品を確認してください。</p>

  <button id="start">抽選する</button>
  <div id="result" style="margin-top:20px; font-size:20px;"></div>

  <button id="staffConfirm" style="display:none; margin-top:20px;">
    説明員が確認しました
  </button>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    /* ------------------------------
       ① Firebase 初期化（触らない）
    ------------------------------ */
    const firebaseConfig = {
      apiKey: "AIzaSyBh1hBHGUJmYyyLq-CIRRuWJiDDb5xZpCM",
      authDomain: "dx-lottery.firebaseapp.com",
      projectId: "dx-lottery",
      storageBucket: "dx-lottery.firebasestorage.app",
      messagingSenderId: "13800927311",
      appId: "1:13800927311:web:633a52a3919394c6f9ba3a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    /* ------------------------------
       ② 抽選ロジック（景品だけ触る）
    ------------------------------ */
    const userType = localStorage.getItem('userType');

    let bonus = 0;
    if (userType === 'general') {
      bonus = Number(localStorage.getItem('qrCount') || 0)
            + Number(localStorage.getItem('quizCorrect') || 0);
    } else if (userType === 'student') {
      bonus = Number(localStorage.getItem('surveyCount') || 0);
    }

    const defaultStock = {
      microSD: 1,
      bottle: 1,
      tote: 300,
      memo500: 500,
      memo100: 100
    };

    if (!localStorage.getItem('stock')) {
      localStorage.setItem('stock', JSON.stringify(defaultStock));
    }

    document.getElementById('start').addEventListener('click', async () => {

      let probability = Math.min(0.05 + bonus * 0.02, 0.9);
      const stock = JSON.parse(localStorage.getItem('stock'));
      const rand = Math.random();

      let prize = "";

      if (rand < probability && stock.microSD > 0) prize = "マイクロSDカード", stock.microSD--;
      else if (rand < probability && stock.bottle > 0) prize = "水筒", stock.bottle--;
      else if (stock.tote > 0) prize = "トートバッグ", stock.tote--;
      else if (stock.memo500 > 0) prize = "SDカード型メモ", stock.memo500--;
      else if (stock.memo100 > 0) prize = "SDカード型付箋", stock.memo100--;
      else prize = "景品終了";

      localStorage.setItem('stock', JSON.stringify(stock));
      localStorage.setItem('prize', prize);

      document.getElementById('result').textContent = "抽選結果： " + prize;
      document.getElementById('staffConfirm').style.display = "block";

      // Firestoreに抽選結果を保存
      const docRef = await addDoc(collection(db, "survey"), {
        prize: prize,
        userType: userType,
        received: "no",
        timestamp: new Date()
      });

      // ドキュメントIDを保存
      localStorage.setItem("lastDocId", docRef.id);
    });

    /* ------------------------------
       ③ スタッフ確認（確認ロジックだけ触る）
    ------------------------------ */
    document.getElementById("staffConfirm").addEventListener("click", async () => {
      const code = prompt("スタッフ確認コードを入力してください:");
      if (code !== "DX2026") {
        alert("コードが違います。スタッフのみ操作可能です。");
        return;
      }

      alert("確認を記録しました。");

      const lastDocId = localStorage.getItem("lastDocId");
      if (!lastDocId) {
        alert("ドキュメントIDが見つかりません。抽選を先に行ってください。");
        return;
      }

      const snapshot = await getDocs(collection(db, "survey"));
      const entryNumber = snapshot.size;

      const docRef = doc(db, "survey", lastDocId);
      await updateDoc(docRef, {
        received: "yes",
        entryNumber: entryNumber
      });
    });

  </script>

</body>
</html>
