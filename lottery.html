<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>抽選ページ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>抽選ページ</h1>
  <p>抽選ボタンを押して景品を確認してください。</p>

  <button id="start">抽選する</button>

  <div id="result" style="margin-top:20px; font-size:20px;"></div>

  <button id="staffConfirm" style="display:none; margin-top:20px;">
    説明員が確認しました
  </button>

  <script>
    // 抽選ボタンの動作テスト
    document.getElementById('start').addEventListener('click', () => {
      const prize = "テスト景品";
      document.getElementById('result').textContent = "抽選結果：" + prize;
      document.getElementById('staffConfirm').style.display = "block";
    });

    // スタッフ確認ボタンの動作テスト
    document.getElementById('staffConfirm').addEventListener('click', () => {
      alert("スタッフ確認完了！");
    });
  </script>

</body>
</html>
