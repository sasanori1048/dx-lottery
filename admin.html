<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>管理者画面（アンケート一覧）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }
    th {
      background: #f0f0f0;
    }
  </style>
</head>
<body>

  <h1>管理者画面（アンケート一覧）</h1>
  <p>Firestore に保存された回答を一覧表示します。</p>

  <table>
    <thead>
      <tr>
        <th>入場番号</th>
        <th>Q1</th>
        <th>Q2</th>
        <th>Q3</th>
        <th>景品</th>
        <th>確認済み</th>
        <th>回答日時</th>
      </tr>
    </thead>
    <tbody id="surveyList"></tbody>
  </table>
  <h2>景品在庫一覧</h2>
  <table id="stockTable">
    <tr><th>景品名</th><th>残数</th></tr>
  </table>
  <h2>在庫補充</h2>
  <div>
    <label>景品：</label>
    <select id="stockItem">
      <option value="microSD">マイクロSDカード</option>
      <option value="bottle">水筒</option>
      <option value="tote">トートバッグ</option>
      <option value="memo500">SDカード型メモ</option>
      <option value="memo100">SDカード型付箋</option>
    </select>

    <label>補充数：</label>
    <input type="number" id="addCount" value="1" min="1">

    <button id="addStockBtn">補充する</button>
  </div>

  <!-- Firebase v10 モジュール構文 -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, getDoc, updateDoc } 
  from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBh1hBHGUJmYyyLq-CIRRuWJiDDb5xZpCM",
  authDomain: "dx-lottery.firebaseapp.com",
  projectId: "dx-lottery",
  storageBucket: "dx-lottery.firebasestorage.app",
  messagingSenderId: "13800927311",
  appId: "1:13800927311:web:633a52a3919394c6f9ba3a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 在庫補充 */
document.getElementById("addStockBtn").addEventListener("click", async () => {
  const itemId = document.getElementById("stockItem").value;
  const addCount = Number(document.getElementById("addCount").value);
  if (addCount <= 0) return alert("補充数は1以上を入力してください");

  const ref = doc(db, "stock", itemId);
  const snap = await getDoc(ref);
  if (!snap.exists()) return alert("在庫データが見つかりません");

  await updateDoc(ref, { count: snap.data().count + addCount });
  alert("補充しました！");

  document.getElementById("stockTable").innerHTML =
    "<tr><th>景品名</th><th>残数</th></tr>";
  loadStock();
});

/* アンケート一覧 */
async function loadSurvey() {
  const list = document.getElementById("surveyList");
  list.innerHTML = "";
  const snapshot = await getDocs(collection(db, "survey"));

  snapshot.forEach(doc => {
    const d = doc.data();
    list.innerHTML += `
      <tr>
        <td>${d.entryNumber || "-"}</td>
        <td>${d.q1}</td>
        <td>${d.q2}</td>
        <td>${d.q3}</td>
        <td>${d.prize || "-"}</td>
        <td>${d.received === "yes" ? "✔" : ""}</td>
        <td>${d.timestamp?.toDate().toLocaleString()}</td>
      </tr>`;
  });
}
loadSurvey();

/* 在庫一覧 */
async function loadStock() {
  const table = document.getElementById("stockTable");
  const snapshot = await getDocs(collection(db, "stock"));

  snapshot.forEach(doc => {
    const d = doc.data();
    table.innerHTML += `<tr><td>${d.name}</td><td>${d.count}</td></tr>`;
  });
}
loadStock();
</script>


</body>
</html>
