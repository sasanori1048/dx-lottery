<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>学生向けページ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>
</head>
<body>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBh1hBHGUJmYyyLq-CIRRuWJiDDb5xZpCM",
    authDomain: "dx-lottery.firebaseapp.com",
    projectId: "dx-lottery",
    storageBucket: "dx-lottery.firebasestorage.app",
    messagingSenderId: "13800927311",
    appId: "1:13800927311:web:633a52a3919394c6f9ba3a"
  };

  // Firebase 初期化
  const app = firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
</script>

  <h1>学生向け 抽選参加ページ</h1>
  <p>アンケートに回答すると抽選確率が上がります。</p>

  <form id="survey">

    <p><strong>Q1：展示会はどうでしたか？</strong></p>
    <label><input type="radio" name="q1" value="良かった"> 良かった</label><br>
    <label><input type="radio" name="q1" value="普通"> 普通</label><br>
    <label><input type="radio" name="q1" value="いまいち"> いまいち</label><br>

    <p><strong>Q2：興味のある技術は？</strong></p>
    <label><input type="radio" name="q2" value="AI"> AI</label><br>
    <label><input type="radio" name="q2" value="ロボット"> ロボット</label><br>
    <label><input type="radio" name="q2" value="セキュリティ"> セキュリティ</label><br>

    <p><strong>Q3：将来やってみたい仕事は？</strong></p>
    <label><input type="radio" name="q3" value="エンジニア"> エンジニア</label><br>
    <label><input type="radio" name="q3" value="研究職"> 研究職</label><br>
    <label><input type="radio" name="q3" value="まだ決めていない"> まだ決めていない</label><br>

    <button type="submit">回答して抽選へ進む</button>
  </form>

  <script>
    
    document.getElementById('survey').addEventListener('submit', async function(e){
    e.preventDefault();

    // 回答内容を取得
    const q1 = document.querySelector('input[name="q1"]:checked')?.value || "";
    const q2 = document.querySelector('input[name="q2"]:checked')?.value || "";
    const q3 = document.querySelector('input[name="q3"]:checked')?.value || "";

    // Firestore に保存
    await db.collection("survey").add({
      q1: q1,
      q2: q2,
      q3: q3,
      timestamp: new Date()
    });

    // 回答回数をlocalStorageに保存
    let count = localStorage.getItem('surveyCount') || 0;
    count++;
    localStorage.setItem('surveyCount', count);

    // 学生ルートであることを記録
    localStorage.setItem('userType','student');

    // 抽選ページへ
    location.href = 'lottery.html';
  });
</script>


</body>
</html>
