<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>抽選ページ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">

  <!-- 🎨 演出用CSS（style.cssに入れてもOK） -->
  <style>
    /* 🎰 本物ルーレット */
    .rouletteContainer {
      width: 220px;
      height: 220px;
      margin: 20px auto;
      position: relative;
    }
    .rouletteWheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: conic-gradient(
        #c00 0deg 20deg,
        #000 20deg 40deg,
        #c00 40deg 60deg,
        #000 60deg 80deg,
        #c00 80deg 100deg,
        #000 100deg 120deg,
        #c00 120deg 140deg,
        #000 140deg 160deg,
        #c00 160deg 180deg,
        #000 180deg 200deg,
        #c00 200deg 220deg,
        #000 220deg 240deg,
        #c00 240deg 260deg,
        #000 260deg 280deg,
        #c00 280deg 300deg,
        #000 300deg 320deg,
        #c00 320deg 340deg,
        #000 340deg 360deg
      );
      border: 6px solid gold;
      box-shadow: 0 0 20px rgba(255,215,0,0.6);
      transform: rotate(0deg);
    }

    /* 🎰 本物スロット */
    .slotMachine {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 20px;
    }
    .reel {
      width: 50px;
      height: 70px;
      background: #222;
      color: #fff;
      font-size: 40px;
      font-weight: bold;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      border: 3px solid gold;
    }
    .spinAnim {
      animation: reelSpin 0.15s linear infinite;
    }
    @keyframes reelSpin {
      0% { transform: translateY(0); }
      100% { transform: translateY(-60px); }
    }

    /* 🎯 本物あみだくじ */
    #amidakujiCanvas {
      border: 2px solid #aaa;
      margin-top: 20px;
    }

    /* ✨ 結果ポップ */
    .resultPop {
      animation: popResult 0.6s ease-out;
    }
    @keyframes popResult {
      0% { transform: scale(0.2); opacity: 0; }
      60% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); }
    }
  </style>
</head>

<body>

  <h1>抽選ページ</h1>
  <p>抽選ボタンを押して景品を確認してください。</p>

  <button id="start">抽選する</button>
  <div id="result" style="margin-top:20px; font-size:20px;"></div>

  <!-- 🎰 本物ルーレット -->
  <div class="rouletteContainer">
    <div class="rouletteWheel" id="rouletteWheel"></div>
  </div>

  <!-- 🎰 本物スロット -->
  <div class="slotMachine">
    <div class="reel" id="reel1">7</div>
    <div class="reel" id="reel2">7</div>
    <div class="reel" id="reel3">7</div>
  </div>

  <!-- 🎯 本物あみだくじ -->
  <canvas id="amidakujiCanvas" width="300" height="300"></canvas>

  <div id="hotBanner">🔥 激熱チャンス！残りわずか！ 🔥</div>
  <div id="rareBanner">🎉 超レア景品当選！ 🎉</div>

  <audio id="rareSound" src="rare.mp3"></audio>

  <button id="staffConfirm" style="display:none; margin-top:20px;">
    説明員が確認しました
  </button>
