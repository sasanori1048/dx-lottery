<head>
<meta charset="UTF-8">
<title>抽選ページ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { font-family: system-ui; text-align:center; background:#e6f4ff; }

/* ▼ ボタン */
button {
  font-size: 26px;
  padding: 20px 45px;
  border-radius: 14px;
  border: none;
  background: #007bff;
  color: white;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,0.25);
  transition: transform 0.1s ease;
}
button:hover { transform: scale(1.05); }

#staffConfirm {
  background: #28a745;
  display:none;
  margin-top: 20px;
}

/* ▼ ルーレット */
.rouletteContainer {
  width:240px;
  height:240px;
  margin:20px auto;
  position:relative;
  display:none;
}
.roulettePointer {
  display:none;
  width:0; height:0;
  border-left:15px solid transparent;
  border-right:15px solid transparent;
  border-top:25px solid gold;
  position:absolute;
  top:-8px;
  left:50%;
  transform:translateX(-50%);
  z-index:20;
}
.rouletteWheel {
  width:100%; height:100%; border-radius:50%;
  background:conic-gradient(
    #c00 0deg 30deg, #000 30deg 60deg,
    #c00 60deg 90deg, #000 90deg 120deg,
    #c00 120deg 150deg, #000 150deg 180deg,
    #c00 180deg 210deg, #000 210deg 240deg,
    #c00 240deg 270deg, #000 270deg 300deg,
    #c00 300deg 330deg, #000 330deg 360deg
  );
  border:8px solid gold;
  box-shadow:none;
  transform:rotate(0deg);
}
.rouletteCenter {
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%, -50%);
  font-size:22px;
  font-weight:bold;
  color:#ffd700;
  text-shadow:0 0 5px #000;
  display:none;
}

/* ▼ スロット */
.slotMachine { display:none; justify-content:center; gap:15px; margin:20px; }
.reel {
  width:80px; height:100px;
  background:radial-gradient(circle,#fff,#ccc,#111);
  color:#ffd700; font-size:36px; font-weight:900;
  border-radius:10px; border:4px solid gold;
  display:flex; justify-content:center; align-items:center;
  text-shadow:0 0 5px #000;
  transition:transform 0.1s ease;
}
.spinAnim { animation:reelSpin 0.18s linear infinite; }
@keyframes reelSpin { 0%{transform:translateY(0);} 100%{transform:translateY(-15px);} }

/* ▼ あみだくじ */
#amidakujiCanvas {
  border:2px solid #aaa;
  margin:20px auto;
  display:none;
  background:#fff;
}
.amidGoals {
  display:none;
  justify-content:space-between;
  width:320px;
  margin:8px auto;
}
.amidGoalIcon {
  width:55px; height:32px; border-radius:8px;
  background:radial-gradient(circle,#fff,#ddd,#999);
  display:flex; align-items:center; justify-content:center; font-size:10px;
}

/* ▼ 景品ラベル点滅 */
@keyframes goalBlink {
  0% { opacity: 1; }
  50% { opacity: 0.2; }
  100% { opacity: 1; }
}

/* ▼ 結果ポップ */
.resultPop { animation:popResult 0.6s ease-out; }
@keyframes popResult {
  0%{transform:scale(0.2);opacity:0;}
  60%{transform:scale(1.2);opacity:1;}
  100%{transform:scale(1);}
}

/* ▼ ガチャガチャ */
.gachaMachine {
  width: 260px;
  height: 300px;
  margin: 20px auto;
  position: relative;
}

.gachaDome {
  width: 200px;
  height: 200px;
  background: #eee;
  border-radius: 50%;
  margin: 0 auto;
  position: relative;
  overflow: hidden;
}

#gachaCapsules .capsule {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  position: absolute;
}

.gachaExit {
  width: 80px;
  height: 40px;
  background: #ccc;
  margin: 10px auto;
  border-radius: 10px;
}
/* ▼ 福引き */
.fukubikiMachine {
  width: 260px;
  height: 300px;
  margin: 20px auto;
  position: relative;
}

.fukubikiBody {
  width: 200px;
  height: 200px;
  background: #eee;
  border-radius: 20px;
  margin: 0 auto;
  position: relative;
  overflow: hidden;
}

#fukubikiBalls .ball {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  position: absolute;
}

.fukubikiHandle {
  width: 40px;
  height: 40px;
  background: #aaa;
  border-radius: 50%;
  margin: 10px auto;
}

.fukubikiExit {
  width: 80px;
  height: 40px;
  background: #ccc;
  margin: 10px auto;
  border-radius: 10px;
}

#hotBanner,#rareBanner { margin-top:10px; display:none; }
</style>
</head>
<body>

<h1>抽選ページ</h1>
<p>抽選ボタンを押して景品を確認してください。</p>

<button id="start">抽選する</button>
<div id="result" style="margin-top:20px; font-size:20px;"></div>

<!-- ▼ ルーレット -->
<div class="rouletteContainer" id="rouletteBox">
  <div class="roulettePointer"></div>
  <div class="rouletteWheel" id="rouletteWheel"></div>
  <div class="rouletteCenter" id="rouletteCenter"></div>
</div>

<!-- ▼ スロット -->
<div class="slotMachine" id="slotBox">
  <div class="reel" id="reel1">7</div>
  <div class="reel" id="reel2">BAR</div>
  <div class="reel" id="reel3">★</div>
</div>

<!-- ▼ あみだくじ -->
<canvas id="amidakujiCanvas" width="320" height="300"></canvas>
<div class="amidGoals">
  <div class="amidGoalIcon" id="goal0"></div>
  <div class="amidGoalIcon" id="goal1"></div>
  <div class="amidGoalIcon" id="goal2"></div>
  <div class="amidGoalIcon" id="goal3"></div>
  <div class="amidGoalIcon" id="goal4"></div>
</div>

<div id="hotBanner">🔥 激熱チャンス！残りわずか！ 🔥</div>
<div id="rareBanner">🎉 超レア景品当選！ 🎉</div>

<button id="staffConfirm">説明員が確認しました</button>

<!-- ▼ ガチャガチャ -->
<div id="gachaEffect" style="display:none;">
  <div class="gachaMachine">
    <div class="gachaDome">
      <div id="gachaCapsules"></div>
    </div>
    <div class="gachaExit"></div>
  </div>
</div>

<!-- ▼ 福引き -->
<div id="fukubikiEffect" style="display:none;">
  <div class="fukubikiMachine">
    <div class="fukubikiBody">
      <div id="fukubikiBalls"></div>
    </div>
    <div class="fukubikiHandle"></div>
    <div class="fukubikiExit"></div>
  </div>
</div>

</body>
<script type="module">
/* ▼ Firebase */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, doc, updateDoc, getDoc, addDoc, setDoc }
  from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey:"AIzaSyBh1hBHGUJmYyyLq-CIRRuWJiDDb5xZpCM",
  authDomain:"dx-lottery.firebaseapp.com",
  projectId:"dx-lottery",
  storageBucket:"dx-lottery.firebasestorage.app",
  messagingSenderId:"13800927311",
  appId:"1:13800927311:web:633a52a3919394c6f9ba3a"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ▼ 在庫管理 */
async function getStock(id){ const s=await getDoc(doc(db,"stock",id)); return s.exists()?s.data().count:0; }
async function decreaseStock(id){
  const r=doc(db,"stock",id); const s=await getDoc(r);
  if(s.exists() && s.data().count>0){ await updateDoc(r,{count:s.data().count-1}); return true; }
  return false;
}

/* ▼ 激熱バナー */
async function checkHot(id){
  const stock=await getStock(id);
  const b=document.getElementById("hotBanner");
  if(stock<=10 && stock>5){ b.textContent="🔥 激熱チャンス！残りわずか！ 🔥"; b.style.display="block"; setTimeout(()=>b.style.display="none",1500); }
  else if(stock<=5 && stock>1){ b.textContent="🔥🔥 超激熱！残り5以下！ 🔥🔥"; b.style.display="block"; setTimeout(()=>b.style.display="none",2000); }
  else if(stock===1){ b.textContent="✨✨ ラスト1！超プレミア！ ✨✨"; b.style.display="block"; setTimeout(()=>b.style.display="none",2500); }
}

/* ▼ 全演出非表示 */
function hideAllEffects(){
  document.getElementById("rouletteBox").style.display="none";
  document.getElementById("slotBox").style.display="none";
  document.getElementById("amidakujiCanvas").style.display="none";
  document.querySelector(".roulettePointer").style.display="none";
  document.querySelector(".amidGoals").style.display="none";
  document.getElementById("rouletteCenter").style.display="none";

  document.getElementById("gachaEffect").style.display="none";
  document.getElementById("fukubikiEffect").style.display="none";

}

/* ▼ ルーレット（矢印修正＋当たり光＋中央に景品表示） */
function playRouletteVegas(prize){
  hideAllEffects();
  const wheel=document.getElementById("rouletteWheel");
  const center=document.getElementById("rouletteCenter");
  const result=document.getElementById("result");

  document.getElementById("rouletteBox").style.display="block";
  document.querySelector(".roulettePointer").style.display="block";

  result.innerHTML="🎰 ルーレット回転中…";

  const angles={
    "マイクロSDカード":30,
    "水筒":90,
    "トートバッグ":150,
    "SDカード型メモ":210,
    "SDカード型付箋":270,
    "景品終了":330
  };
  const target=angles[prize] ?? Math.floor(Math.random()*360);

  wheel.style.transition="none";
  wheel.style.transform="rotate(0deg)";
  wheel.style.boxShadow="none";
  center.style.display="none";

  setTimeout(()=>{
    wheel.style.transition="transform 4.5s cubic-bezier(0.05,0.9,0.1,1)";
    wheel.style.transform=`rotate(${360*8+target}deg)`;

    setTimeout(()=>{
      result.innerHTML="🎉 抽選結果： "+prize;
      result.classList.add("resultPop");

      wheel.style.boxShadow="0 -35px 25px gold";

      center.textContent=prize;   /* ← 中央に景品名表示 */
      center.style.display="block";

    },4500);
  },50);
}

/* ▼ スロット（本物の停止演出：ガッガッガッ → カチッ） */
function playSlotEffect(prize){
  hideAllEffects();
  const r1=document.getElementById("reel1");
  const r2=document.getElementById("reel2");
  const r3=document.getElementById("reel3");
  const result=document.getElementById("result");

  document.getElementById("slotBox").style.display="flex";
  result.innerHTML="🎰 スロット回転中…";

  const sym=["7","BAR","★"];

  function spin(reel){
    reel.classList.add("spinAnim");
  }
  function stopReel(reel,time){
    setTimeout(()=>{
      reel.classList.remove("spinAnim");

      /* ガッガッガッ揺れ演出 */
      let shakes=0;
      const shakeInt=setInterval(()=>{
        reel.style.transform=`translateY(${(shakes%2===0)?'-10px':'10px'})`;
        shakes++;
        if(shakes>6){
          clearInterval(shakeInt);
          reel.style.transform="scale(1.2)";
          reel.innerHTML=sym[Math.floor(Math.random()*sym.length)];
          setTimeout(()=>reel.style.transform="scale(1)",120);
        }
      },60);
    },time);
  }

  spin(r1); spin(r2); spin(r3);

  stopReel(r1,1600);
  stopReel(r2,2200);
  stopReel(r3,2800);

  setTimeout(()=>{
    result.innerHTML="🎉 抽選結果： "+prize;
    result.classList.add("resultPop");
  },3000);
}

/* ▼ あみだくじ（結果連動＋赤線＋景品ラベルだけ点滅） */
const prizeNames=["マイクロSDカード","水筒","トートバッグ","SDカード型メモ","SDカード型付箋"];

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function setupAmidGoals(){
  const s=shuffle([...prizeNames]);
  for(let i=0;i<5;i++) document.getElementById("goal"+i).textContent=s[i];
  return s;
}

function generateBars(cols,h){
  const bars=[];
  for(let i=0;i<12;i++){
    bars.push({ y:Math.floor(Math.random()*(h-40))+20, fromCol:Math.floor(Math.random()*(cols-1)) });
  }
  return bars.sort((a,b)=>a.y-b.y);
}

function drawBase(ctx,cols,w,h,bars){
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle="#444"; ctx.lineWidth=3;
  const colX=[];
  for(let i=0;i<cols;i++){
    const x=30+i*((w-60)/(cols-1));
    colX.push(x);
    ctx.beginPath(); ctx.moveTo(x,10); ctx.lineTo(x,h-10); ctx.stroke();
  }
  for(const bar of bars){
    ctx.beginPath();
    ctx.moveTo(colX[bar.fromCol],bar.y);
    ctx.lineTo(colX[bar.fromCol+1],bar.y);
    ctx.stroke();
  }
  return colX;
}

function playAmidakujiEffect(prize){
  hideAllEffects();

  const canvas=document.getElementById("amidakujiCanvas");
  const ctx=canvas.getContext("2d");
  const result=document.getElementById("result");

  canvas.style.display="block";
  document.querySelector(".amidGoals").style.display="flex";

  result.innerHTML="🎯 あみだくじ進行中…";

  const w=canvas.width, h=canvas.height, cols=5;
  const goals=setupAmidGoals();
  const prizeIndex=goals.indexOf(prize); /* ← 結果とゴール完全連動 */

  const bars=generateBars(cols,h);
  const colX=drawBase(ctx,cols,w,h,bars);

  ctx.strokeStyle="#ff0000"; /* ← 赤線 */
  ctx.lineWidth=4;

  let col=prizeIndex;
  let y=10;

  const interval=setInterval(()=>{
    ctx.beginPath(); ctx.moveTo(colX[col],y); y+=2; ctx.lineTo(colX[col],y); ctx.stroke();

    for(const bar of bars){
      if(Math.abs(bar.y-y)<4){
        ctx.beginPath();
        if(bar.fromCol===col){
          ctx.moveTo(colX[col],y); ctx.lineTo(colX[col+1],y); ctx.stroke();
          col++;
        } else if(bar.fromCol+1===col){
          ctx.moveTo(colX[col],y); ctx.lineTo(colX[col-1],y); ctx.stroke();
          col--;
        }
      }
    }

    if(y>=h-10){
      clearInterval(interval);

      /* 景品ラベルだけ点滅 */
      const goalLabel=document.getElementById("goal"+col);
      goalLabel.style.animation="goalBlink 0.8s infinite";

      setTimeout(()=>{
        goalLabel.style.animation="none";

        result.innerHTML="🎉 抽選結果： "+prize;
        result.classList.add("resultPop");

        document.querySelector(".amidGoals").style.display="none";
      },5000);
    }
  },80);
}


/* ▼ 抽選ボタン */
document.getElementById("start").addEventListener("click", async () => {
  localStorage.removeItem("lastDocId");

  // ▼ 在庫がある景品だけを抽選候補に入れる
  const candidates = [];

  if (await getStock("microSD") > 0) candidates.push("マイクロSDカード");
  if (await getStock("bottle") > 0) candidates.push("水筒");
  if (await getStock("tote") > 0) candidates.push("トートバッグ");
  if (await getStock("memo500") > 0) candidates.push("SDカード型メモ");
  if (await getStock("memo100") > 0) candidates.push("SDカード型付箋");

  let prize = "";

  // ▼ 在庫が全て 0 の場合
  if (candidates.length === 0) {
    prize = "景品終了";
  } else {
    // ▼ 在庫がある景品からランダムに選ぶ
    prize = candidates[Math.floor(Math.random() * candidates.length)];

    // ▼ 選んだ景品の在庫を減らす
    const stockIdMap = {
      "マイクロSDカード": "microSD",
      "水筒": "bottle",
      "トートバッグ": "tote",
      "SDカード型メモ": "memo500",
      "SDカード型付箋": "memo100"
    };

    await decreaseStock(stockIdMap[prize]);
    await checkHot(stockIdMap[prize]);
  }

  // ▼ ランダム演出
  playRandomEffect(prize);

  // ▼ スタッフ確認ボタン表示
  document.getElementById("staffConfirm").style.display = "block";

  // ▼ Firestore 保存
  const newDoc = await addDoc(collection(db, "survey"), {
    prize,
    received: "no",
    entryNumber: null,
    timestamp: new Date()
  });

  localStorage.setItem("lastDocId", newDoc.id);
});



/* ▼ スタッフ確認 */
document.getElementById("staffConfirm").addEventListener("click",async()=>{
  const code=prompt("スタッフ確認コードを入力してください:");
  if(code!=="o") return alert("コードが違います");

  const docRef=doc(db,"survey",localStorage.getItem("lastDocId"));
  const counterRef=doc(db,"meta","entryCounter");
  const snap=await getDoc(counterRef);
  const num=snap.exists()?snap.data().lastNumber+1:1;

  await setDoc(counterRef,{lastNumber:num});
  await updateDoc(docRef,{received:"yes",entryNumber:num});
});

/* ▼▼▼ ガチャガチャ・福引き用カラー変換 ▼▼▼ */
const prizeColorMap = {
  microSD: "red",
  bottle: "blue",
  tote: "green",
  memo500: "yellow",
  memo100: "white"
};

/* ▼▼▼ ガチャガチャ演出 ▼▼▼ */
function playGachagachaEffect(prize){
  hideAllEffects();
  const box=document.getElementById("gachaEffect");
  box.style.display="block";

  const area=document.getElementById("gachaCapsules");
  area.innerHTML="";

  const color=prizeColorMap[{
    "マイクロSDカード":"microSD",
    "水筒":"bottle",
    "トートバッグ":"tote",
    "SDカード型メモ":"memo500",
    "SDカード型付箋":"memo100"
  }[prize]];

  // カプセル生成
  for(let i=0;i<8;i++){
    const c=document.createElement("div");
    c.className="capsule";
    c.style.background=color;
    c.style.left=Math.random()*200+"px";
    c.style.top=Math.random()*200+"px";
    area.appendChild(c);
  }

  // 回転アニメーション
  area.style.transition="transform 1.2s ease";
  area.style.transform="rotate(720deg)";

  // 最後に1つ落とす
  setTimeout(()=>{
    const last=area.children[0];
    last.style.top="260px";
    last.style.left="110px";
  },1200);
}

/* ▼▼▼ 福引き演出 ▼▼▼ */
function playFukubikiEffect(prize){
  hideAllEffects();
  const box=document.getElementById("fukubikiEffect");
  box.style.display="block";

  const area=document.getElementById("fukubikiBalls");
  area.innerHTML="";

  const color=prizeColorMap[{
    "マイクロSDカード":"microSD",
    "水筒":"bottle",
    "トートバッグ":"tote",
    "SDカード型メモ":"memo500",
    "SDカード型付箋":"memo100"
  }[prize]];

  // 玉生成
  for(let i=0;i<6;i++){
    const b=document.createElement("div");
    b.className="ball";
    b.style.background=color;
    b.style.left=Math.random()*160+"px";
    b.style.top=Math.random()*160+"px";
    area.appendChild(b);
  }

  // ハンドル回転
  const handle=document.querySelector(".fukubikiHandle");
  handle.style.transition="transform 1.2s ease";
  handle.style.transform="rotate(720deg)";

  // 最後に1つ落とす
  setTimeout(()=>{
    const last=area.children[0];
    last.style.top="220px";
    last.style.left="85px";
  },1200);
}

/* ▼▼▼ ランダム演出（5種類に拡張） ▼▼▼ */
function playRandomEffect(prize){
  hideAllEffects();

  const effects=[
    playRouletteVegas,
    playSlotEffect,
    playAmidakujiEffect,
    playGachagachaEffect,
    playFukubikiEffect
  ];

  const f=effects[Math.floor(Math.random()*effects.length)];
  f(prize);
}
</script>
