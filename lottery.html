<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>抽選ページ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>抽選ページ</h1>
  <p>抽選ボタンを押して景品を確認してください。</p>

  <button id="start">抽選する</button>
  <div id="result" style="margin-top:20px; font-size:20px;"></div>
  <div id="hotBanner">🔥 激熱チャンス！残りわずか！ 🔥</div>
  <div id="rareBanner">🎉 超レア景品当選！ 🎉</div>

  <audio id="rareSound" src="rare.mp3"></audio>

  <button id="staffConfirm" style="display:none; margin-top:20px;">
    説明員が確認しました
  </button>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, updateDoc, getDoc, addDoc, setDoc } 
      from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    /* ------------------------------
       ① Firebase 初期化（触らない）
    ------------------------------ */
    const firebaseConfig = {
      apiKey: "AIzaSyBh1hBHGUJmYyyLq-CIRRuWJiDDb5xZpCM",
      authDomain: "dx-lottery.firebaseapp.com",
      projectId: "dx-lottery",
      storageBucket: "dx-lottery.firebasestorage.app",
      messagingSenderId: "13800927311",
      appId: "1:13800927311:web:633a52a3919394c6f9ba3a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 在庫を取得する
    async function getStock(itemId) {
      const ref = doc(db, "stock", itemId);
      const snap = await getDoc(ref);
      return snap.exists() ? snap.data().count : 0;
    }

    // 在庫を1つ減らす
    async function decreaseStock(itemId) {
      const ref = doc(db, "stock", itemId);
      const snap = await getDoc(ref);
      if (snap.exists()) {
        const current = snap.data().count;
        if (current > 0) {
          await updateDoc(ref, { count: current - 1 });
          return true;
        }
      }
      return false;
    }
    async function checkHot(itemId) {
      const stock = await getStock(itemId);

      // 🔥 在庫10以下 → 激熱
      if (stock <= 10 && stock > 5) {
        document.body.classList.add("hot-flash");
        const banner = document.getElementById("hotBanner");
        banner.textContent = "🔥 激熱チャンス！残りわずか！ 🔥";
        banner.style.display = "block";

        setTimeout(() => {
          document.body.classList.remove("hot-flash");
          banner.style.display = "none";
        }, 1500);
      }

      // 🔥 在庫5以下 → 超激熱
      if (stock <= 5 && stock > 1) {
        const banner = document.getElementById("hotBanner");
        banner.textContent = "🔥🔥 超激熱！残り5以下！ 🔥🔥";
        banner.style.display = "block";

        document.getElementById("start").classList.add("hot-shake");

        setTimeout(() => {
          document.getElementById("start").classList.remove("hot-shake");
          banner.style.display = "none";
        }, 2000);
      }

      // ✨ 在庫1 → ラスト1演出
      if (stock === 1) {
        const banner = document.getElementById("hotBanner");
        banner.textContent = "✨✨ ラスト1！超プレミア！ ✨✨";
        banner.style.display = "block";

        document.body.classList.add("hot-flash");

        setTimeout(() => {
          document.body.classList.remove("hot-flash");
          banner.style.display = "none";
        }, 2500);
      }
    }
    function rareEffect() {
      document.body.classList.add("rare-flash");
      setTimeout(() => document.body.classList.remove("rare-flash"), 1000);
    }

    function showRareBanner() {
      const banner = document.getElementById("rareBanner");
      banner.style.display = "block";
      setTimeout(() => banner.style.display = "none", 2500);
    }

    function rareButtonEffect() {
      const btn = document.getElementById("start");
      btn.classList.add("rare-button");
      setTimeout(() => btn.classList.remove("rare-button"), 2500);
    }

    function playRareSound() {
      document.getElementById("rareSound").play();
    }

    /* ------------------------------
       ② 抽選ロジック（景品だけ触る）
    ------------------------------ */
    const userType = localStorage.getItem('userType');

    let bonus = 0;
    if (userType === 'general') {
      bonus = Number(localStorage.getItem('qrCount') || 0)
            + Number(localStorage.getItem('quizCorrect') || 0);
    } else if (userType === 'student') {
      bonus = Number(localStorage.getItem('surveyCount') || 0);
    }


    document.getElementById('start').addEventListener('click', async () => {

      let probability = Math.min(0.05 + bonus * 0.02, 0.9);
      const rand = Math.random();

      let prize = "";

      if (rand < probability && await getStock("microSD") > 0) {
        prize = "マイクロSDカード";

        // ✨ レア演出
        rareEffect();
        showRareBanner();
        rareButtonEffect();
        playRareSound();

        await decreaseStock("microSD");
        await checkHot("microSD");
      }
      else if (rand < probability && await getStock("bottle") > 0) {
        prize = "水筒";

        // ✨ レア演出
        rareEffect();
        showRareBanner();
        rareButtonEffect();
        playRareSound();

        await decreaseStock("bottle");
        await checkHot("bottle");
      }
      else if (await getStock("tote") > 0) {
        prize = "トートバッグ";
        await decreaseStock("tote");
        await checkHot("tote");


      } else if (await getStock("memo500") > 0) {
        prize = "SDカード型メモ";
        await decreaseStock("memo500");

      } else if (await getStock("memo100") > 0) {
        prize = "SDカード型付箋";
        await decreaseStock("memo100");

      } else {
        prize = "景品終了";
      }

      document.getElementById('result').textContent = "抽選結果： " + prize;
      document.getElementById('staffConfirm').style.display = "block";

      // ここから下は、今まで通りのアンケート統合処理でOK
      const snapshot = await getDocs(collection(db, "survey"));
      const docs = snapshot.docs;
      const lastDoc = docs[docs.length - 1];

      if (lastDoc) {
        const docRef = doc(db, "survey", lastDoc.id);
        await updateDoc(docRef, {
          prize: prize,
          received: "no",
          timestamp: new Date()
        });
        localStorage.setItem("lastDocId", lastDoc.id);
      }
    });


    /* ------------------------------
       ③ スタッフ確認（確認ロジックだけ触る）
    ------------------------------ */
    document.getElementById("staffConfirm").addEventListener("click", async () => {
      const code = prompt("スタッフ確認コードを入力してください:");
      if (code !== "DX2026") {
        alert("コードが違います。スタッフのみ操作可能です。");
        return;
      }

      alert("確認を記録しました。");

      const lastDocId = localStorage.getItem("lastDocId");
      if (!lastDocId) {
        alert("ドキュメントIDが見つかりません。抽選を先に行ってください。");
        return;
      }

      // entryCounter ドキュメントを使って連番を管理
      const counterRef = doc(db, "meta", "entryCounter");
      const counterSnap = await getDoc(counterRef);
      let entryNumber = 1;

      if (counterSnap.exists()) {
        entryNumber = counterSnap.data().lastNumber + 1;
        await updateDoc(counterRef, { lastNumber: entryNumber });
      } else {
        await setDoc(counterRef, { lastNumber: 1 });
      }
      // 抽選結果を更新（景品は上書きしない）
      const docRef = doc(db, "survey", lastDocId);
      await updateDoc(docRef, {
        received: "yes",
        entryNumber: entryNumber
      });
    });

  </script>

</body>
</html>
