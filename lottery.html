<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>抽選ページ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">

  <!-- 🎨 演出用CSS -->
  <style>
    /* 🎰 本物ルーレット */
    .rouletteContainer {
      width: 220px;
      height: 220px;
      margin: 20px auto;
      position: relative;
      display:none;
    }
    .rouletteWheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: conic-gradient(
        #c00 0deg 20deg,
        #000 20deg 40deg,
        #c00 40deg 60deg,
        #000 60deg 80deg,
        #c00 80deg 100deg,
        #000 100deg 120deg,
        #c00 120deg 140deg,
        #000 140deg 160deg,
        #c00 160deg 180deg,
        #000 180deg 200deg,
        #c00 200deg 220deg,
        #000 220deg 240deg,
        #c00 240deg 260deg,
        #000 260deg 280deg,
        #c00 280deg 300deg,
        #000 300deg 320deg,
        #c00 320deg 340deg,
        #000 340deg 360deg
      );
      border: 6px solid gold;
      box-shadow: 0 0 20px rgba(255,215,0,0.6);
      transform: rotate(0deg);
    }

    /* 🎰 本物スロット */
    .slotMachine {
      display:none;
      justify-content: center;
      gap: 10px;
      margin: 20px;
    }
    .reel {
      width: 50px;
      height: 70px;
      background: #222;
      color: #fff;
      font-size: 40px;
      font-weight: bold;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      border: 3px solid gold;
    }
    .spinAnim {
      animation: reelSpin 0.15s linear infinite;
    }
    @keyframes reelSpin {
      0% { transform: translateY(0); }
      100% { transform: translateY(-60px); }
    }

    /* 🎯 本物あみだくじ */
    #amidakujiCanvas {
      border: 2px solid #aaa;
      margin-top: 20px;
      display:none;
    }

    /* ✨ 結果ポップ */
    .resultPop {
      animation: popResult 0.6s ease-out;
    }
    @keyframes popResult {
      0% { transform: scale(0.2); opacity: 0; }
      60% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); }
    }
  </style>
</head>

<body>

  <h1>抽選ページ</h1>
  <p>抽選ボタンを押して景品を確認してください。</p>

  <button id="start">抽選する</button>
  <div id="result" style="margin-top:20px; font-size:20px;"></div>

  <!-- 🎰 本物ルーレット -->
  <div class="rouletteContainer" id="rouletteBox">
    <div class="rouletteWheel" id="rouletteWheel"></div>
  </div>

  <!-- 🎰 本物スロット -->
  <div class="slotMachine" id="slotBox">
    <div class="reel" id="reel1">7</div>
    <div class="reel" id="reel2">7</div>
    <div class="reel" id="reel3">7</div>
  </div>

  <!-- 🎯 本物あみだくじ -->
  <canvas id="amidakujiCanvas" width="300" height="300"></canvas>

  <div id="hotBanner">🔥 激熱チャンス！残りわずか！ 🔥</div>
  <div id="rareBanner">🎉 超レア景品当選！ 🎉</div>

  <audio id="rareSound" src="rare.mp3"></audio>

  <button id="staffConfirm" style="display:none; margin-top:20px;">
    説明員が確認しました
  </button>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, updateDoc, getDoc, addDoc, setDoc } 
      from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    /* Firebase 初期化 */
    const firebaseConfig = {
      apiKey: "AIzaSyBh1hBHGUJmYyyLq-CIRRuWJiDDb5xZpCM",
      authDomain: "dx-lottery.firebaseapp.com",
      projectId: "dx-lottery",
      storageBucket: "dx-lottery.firebasestorage.app",
      messagingSenderId: "13800927311",
      appId: "1:13800927311:web:633a52a3919394c6f9ba3a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    /* 在庫取得 */
    async function getStock(itemId) {
      const ref = doc(db, "stock", itemId);
      const snap = await getDoc(ref);
      return snap.exists() ? snap.data().count : 0;
    }

    async function decreaseStock(itemId) {
      const ref = doc(db, "stock", itemId);
      const snap = await getDoc(ref);
      if (snap.exists()) {
        const current = snap.data().count;
        if (current > 0) {
          await updateDoc(ref, { count: current - 1 });
          return true;
        }
      }
      return false;
    }

    async function checkHot(itemId) {
      const stock = await getStock(itemId);
      const banner = document.getElementById("hotBanner");

      if (stock <= 10 && stock > 5) {
        banner.textContent = "🔥 激熱チャンス！残りわずか！ 🔥";
        banner.style.display = "block";
        setTimeout(() => banner.style.display = "none", 1500);
      }
      if (stock <= 5 && stock > 1) {
        banner.textContent = "🔥🔥 超激熱！残り5以下！ 🔥🔥";
        banner.style.display = "block";
        setTimeout(() => banner.style.display = "none", 2000);
      }
      if (stock === 1) {
        banner.textContent = "✨✨ ラスト1！超プレミア！ ✨✨";
        banner.style.display = "block";
        setTimeout(() => banner.style.display = "none", 2500);
      }
    }

    /* 🎯 全演出非表示 */
    function hideAllEffects() {
      document.getElementById("rouletteBox").style.display = "none";
      document.getElementById("slotBox").style.display = "none";
      document.getElementById("amidakujiCanvas").style.display = "none";
    }

    /* 🎰 ルーレット */
    function playRouletteVegas(prize) {
      hideAllEffects();
      document.getElementById("rouletteBox").style.display = "block";

      const wheel = document.getElementById("rouletteWheel");
      const result = document.getElementById("result");

      wheel.style.transition = "transform 3.5s cubic-bezier(0.1, 0.9, 0.2, 1)";
      const spinDeg = 360 * 8 + Math.floor(Math.random() * 360);
      wheel.style.transform = `rotate(${spinDeg}deg)`;

      result.innerHTML = "🎰 ルーレット回転中…";

      setTimeout(() => {
        result.innerHTML = "🎉 抽選結果： " + prize;
        result.classList.add("resultPop");
      }, 3500);
    }

    /* 🎰 スロット */
    function playSlotEffect(prize) {
      hideAllEffects();
      document.getElementById("slotBox").style.display = "flex";

      const r1 = document.getElementById("reel1");
      const r2 = document.getElementById("reel2");
      const r3 = document.getElementById("reel3");
      const result = document.getElementById("result");

      result.innerHTML = "🎰 スロット回転中…";

      r1.classList.add("spinAnim");
      r2.classList.add("spinAnim");
      r3.classList.add("spinAnim");

      const nums = ["1","2","3","4","5","6","7","8","9"];

      setTimeout(() => {
        r1.classList.remove("spinAnim");
        r1.innerHTML = nums[Math.floor(Math.random()*nums.length)];
      }, 1500);

      setTimeout(() => {
        r2.classList.remove("spinAnim");
        r2.innerHTML = nums[Math.floor(Math.random()*nums.length)];
      }, 2200);

      setTimeout(() => {
        r3.classList.remove("spinAnim");
        r3.innerHTML = nums[Math.floor(Math.random()*nums.length)];
        result.innerHTML = "🎉 抽選結果： " + prize;
        result.classList.add("resultPop");
      }, 3000);
    }

    /* 🎯 あみだくじベース線 */
    function drawAmidakujiBase(ctx) {
      ctx.strokeStyle = "#444";
      ctx.lineWidth = 3;

      // 縦線
      for (let x of [50, 150, 250]) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, 300);
        ctx.stroke();
      }

      // 横線
      for (let i = 0; i < 10; i++) {
        let y = Math.random() * 280 + 10;
        let x = Math.random() < 0.5 ? 50 : 150;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + 100, y);
        ctx.stroke();
      }
    }

    /* 🎯 あみだくじ */
    function playAmidakujiEffect(prize) {
      hideAllEffects();
      const canvas = document.getElementById("amidakujiCanvas");
      canvas.style.display = "block";

      const ctx = canvas.getContext("2d");
      const result = document.getElementById("result");

      result.innerHTML = "🎯 あみだくじ進行中…";

      ctx.clearRect(0,0,300,300);

      drawAmidakujiBase(ctx);

      ctx.lineWidth = 4;

        ctx.beginPath();
        ctx.moveTo(x, y);
        y += 10;
        ctx.lineTo(x, y);
        ctx.stroke();
